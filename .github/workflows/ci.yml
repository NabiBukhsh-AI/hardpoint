name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github
      - name: ruff format --check
        run: uv run ruff format --check

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy --strict src/hardpoint

  import-lint:
    name: Layer rules (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run lint-imports --verbose

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: pytest
        run: >
          uv run pytest
          --cov=hardpoint
          --cov-report=term-missing
          --cov-report=xml
      - name: Enforce coverage floor on core
        run: uv run python scripts/check_coverage.py

  bare-environment:
    name: Bare-environment import (base dependencies only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install the package with no extras and no dev dependencies
        run: |
          uv venv --python 3.11 .venv-bare
          # `uv pip install .` installs the project and its base dependencies
          # only: dependency groups are not part of the pip interface, and no
          # extra is requested. That is exactly the bare environment wanted.
          uv pip install --python .venv-bare .
      - name: Assert no optional dependency is installed
        run: .venv-bare/bin/python scripts/assert_bare_env.py
      - name: Import every hardpoint module
        run: .venv-bare/bin/python scripts/import_all.py

  template-smoke:
    name: Templates (wheel -> init -> install -> test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build the wheel users will install
        run: uv build --wheel --out-dir dist
      - name: Install it into a clean environment
        run: |
          uv venv --python 3.11 .venv-smoke
          uv pip install --python .venv-smoke dist/*.whl
      - name: Generate, install and test every template
        run: |
          templates=$(.venv-smoke/bin/python -c "from hardpoint.cli.commands.init import TEMPLATES; print(' '.join(TEMPLATES))")
          for template in $templates; do
            echo "::group::$template"
            .venv-smoke/bin/hardpoint init "smoke-$template" --template "$template"
            uv pip install --python .venv-smoke -e "smoke-$template[dev]"
            (cd "smoke-$template" && ../.venv-smoke/bin/hardpoint --env offline doctor)
            (cd "smoke-$template" && ../.venv-smoke/bin/hardpoint --env offline ingest run)
            (cd "smoke-$template" && ../.venv-smoke/bin/hardpoint --env offline ask "How do I rotate an API key?")
            (cd "smoke-$template" && ../.venv-smoke/bin/python -m pytest -q)
            echo "::endgroup::"
          done
