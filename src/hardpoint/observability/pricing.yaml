# Prices in US dollars per million tokens, keyed by the model id an adapter
# reports ("<provider>/<model>"). Providers change prices; check before relying
# on a figure, and override per project under `pricing:` in config/base.yaml.
#
# A model missing from this table is *unpriced*: its cost is reported as null
# and a warning is logged once per process. It is never reported as zero.
#
# Last reviewed: 2025-06. Entries are list prices for standard (non-batch,
# non-cached) usage.
version: 1
models:
  openai/gpt-4o:                 {input: 2.50, output: 10.00}
  openai/gpt-4o-mini:            {input: 0.15, output: 0.60}
  openai/gpt-4.1:                {input: 2.00, output: 8.00}
  openai/gpt-4.1-mini:           {input: 0.40, output: 1.60}
  openai/gpt-4.1-nano:           {input: 0.10, output: 0.40}
  openai/o3-mini:                {input: 1.10, output: 4.40}
  openai/text-embedding-3-small: {embed: 0.02}
  openai/text-embedding-3-large: {embed: 0.13}
  openai/text-embedding-ada-002: {embed: 0.10}
  anthropic/claude-3-5-haiku-latest:  {input: 0.80, output: 4.00}
  anthropic/claude-3-7-sonnet-latest: {input: 3.00, output: 15.00}
  anthropic/claude-sonnet-4-0:        {input: 3.00, output: 15.00}
  anthropic/claude-opus-4-0:          {input: 15.00, output: 75.00}
  cohere/rerank-v3.5:                 {per_call: 0.002}
